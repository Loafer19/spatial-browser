[package]
name = "cef-bridge"
version = "0.10.0"
edition = "2021"
license = "MIT"

[features]
default = ["accelerated_osr"]
accelerated_osr = ["cef/accelerated_osr"]

[dependencies]
# Disable default `single-thread` so Engine is Sync/Send for CEF's IO thread.
# `resource-assembler` parses classic uBO scriptlets.js for ##+js inject.
adblock = { version = "0.13", default-features = false, features = [
    "embedded-domain-resolver",
    "full-regex-handling",
    "resource-assembler",
] }
cef = { version = "154.5.0", default-features = false }
log = "0.4"
wgpu = "30"
winit = "0.30"

[dev-dependencies]
# Independent check of favicon.rs's PNG encoder (both already in the tree).
crc32fast = "1.5"
flate2 = "1.1"

[lints]
workspace = true
