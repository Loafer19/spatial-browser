[package]
name = "cef-bridge"
version = "0.1.0"
edition = "2021"
license = "MIT"

[features]
default = ["accelerated_osr"]
accelerated_osr = ["cef/accelerated_osr"]

[dependencies]
# Disable default `single-thread` so Engine is Sync/Send for CEF's IO thread.
# `resource-assembler` parses classic uBO scriptlets.js for ##+js inject.
adblock = { version = "0.13", default-features = false, features = [
    "embedded-domain-resolver",
    "full-regex-handling",
    "resource-assembler",
] }
cef = { version = "151.8.0", default-features = false }
log = "0.4"
wgpu = "30"
winit = "0.30"
