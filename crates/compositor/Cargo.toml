[package]
name = "compositor"
version = "0.1.0"
edition = "2021"
license = "MIT"

[package.metadata.cef.bundle]
helper_name = "compositor_helper"

[features]
default = ["accelerated_osr"]
accelerated_osr = ["cef/accelerated_osr", "cef-bridge/accelerated_osr"]

[dependencies]
cef = { version = "151.8.0", default-features = false }
cef-bridge = { path = "../cef-bridge", default-features = false }
bytemuck = "1"
log = "0.4.33"
pollster = "1.0.1"
wgpu = "30.0.0"
winit = "0.30.13"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1.3"
rfd = "0.15"
aes-gcm = "0.10.3"
argon2 = "0.5.3"
rand = { version = "0.10.2", features = ["std_rng"] }
zeroize = { version = "1.9.0", features = ["derive"] }
getrandom = "0.4.3"
font8x8 = "0.3.1"
