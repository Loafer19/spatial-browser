[package]
name = "import-chrome"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "One-time migration: read Chrome's Bookmarks file and merge into spatial-browser's bookmarks.json"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
