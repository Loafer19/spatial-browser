name: Release

# On version tag push (v*).
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  # Keep in sync with crates/*/Cargo.toml cef version.
  CEF_VERSION: 151.8.0+151.3.24
  CEF_PATH: ${{ github.workspace }}/.cef-cache

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      # Restore-only: tag-scoped saves are not reusable across tags.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: "false"

      - name: Restore CEF distribution
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.CEF_PATH }}
          key: cef-${{ env.CEF_VERSION }}-${{ runner.os }}

      - name: Restore bundle-cef-app
        uses: actions/cache/restore@v5
        with:
          path: ~/.local/share/cargo-cef-tools
          key: cargo-cef-tools-${{ env.CEF_VERSION }}-${{ runner.os }}

      - name: Install bundle-cef-app
        run: |
          cargo install cef --version "${CEF_VERSION}" --locked \
            --root ~/.local/share/cargo-cef-tools

      - name: Bundle
        run: ./scripts/bundle.sh compositor

      - name: Package
        run: tar czf spatial-browser-linux-x86_64.tar.gz -C target/bundle .

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          files: spatial-browser-linux-x86_64.tar.gz
          generate_release_notes: true
