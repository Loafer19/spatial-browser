name: CI

# Seed default-branch caches for release.yml (tags are restore-only).
on:
  push:
    branches:
      - master

env:
  # Keep in sync with release.yml and crates/*/Cargo.toml cef version.
  CEF_VERSION: 154.5.0+154.0.34
  CEF_PATH: ${{ github.workspace }}/.cef-cache

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          # Only master writes rust caches (tags restore-only in release.yml).
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Cache CEF distribution
        uses: actions/cache@v5
        with:
          path: ${{ env.CEF_PATH }}
          key: cef-${{ env.CEF_VERSION }}-${{ runner.os }}

      - name: Cache bundle-cef-app
        uses: actions/cache@v5
        with:
          path: ~/.local/share/cargo-cef-tools
          key: cargo-cef-tools-${{ env.CEF_VERSION }}-${{ runner.os }}

      - name: Install bundle-cef-app
        run: |
          cargo install cef --version "${CEF_VERSION}" --locked \
            --root ~/.local/share/cargo-cef-tools

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      - name: Bundle
        run: ./scripts/bundle.sh compositor
