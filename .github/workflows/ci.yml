name: CI

# Seeds default-branch caches for release.yml. GitHub Actions caches are
# only writable on the creating ref (+ readable as fallback from the
# default branch). Release runs on tags with restore-only so they do not
# accumulate one-off rust/CEF caches per tag.
on:
  push:
    branches:
      - master

env:
  # Keep in sync with release.yml's CEF_VERSION and the `cef = { version
  # = "..." }` line in crates/*/Cargo.toml.
  CEF_VERSION: 151.8.0+151.3.24
  CEF_PATH: ${{ github.workspace }}/.cef-cache

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      # checkout/cache v5+ run on Node 24 (v4 warned as Node 20 deprecated).
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          # Only master should write rust caches (this workflow is
          # master-only already; keep the guard explicit).
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Cache CEF distribution
        uses: actions/cache@v5
        with:
          path: ${{ env.CEF_PATH }}
          key: cef-${{ env.CEF_VERSION }}-${{ runner.os }}

      - name: Cache bundle-cef-app
        uses: actions/cache@v5
        with:
          path: ~/.local/share/cargo-cef-tools
          key: cargo-cef-tools-${{ env.CEF_VERSION }}-${{ runner.os }}

      - name: Install bundle-cef-app
        run: |
          cargo install cef --version "${CEF_VERSION}" --locked \
            --root ~/.local/share/cargo-cef-tools

      - name: Bundle
        run: ./scripts/bundle.sh compositor
